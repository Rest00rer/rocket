services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-checkstock}"
      POSTGRES_USER: "${POSTGRES_USER:-checkstock}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Run 'make setup' or set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstock} -d ${POSTGRES_DB:-checkstock}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - checkstock-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    environment:
      APP_NAME: "${APP_NAME:-CheckStock}"
      APP_ENV: "${APP_ENV:-development}"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5173"]}'
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:?Run 'make setup' or set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-checkstock}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8000/api}"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - checkstock-node-modules:/app/node_modules

volumes:
  checkstock-postgres:
  checkstock-node-modules:

